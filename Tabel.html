<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implementasi Tabel HTML</title>
</head>
<body>
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th rowspan="2">Kategori</th>
                <th colspan="2">Rincian Produk</th>
            </tr>
            <tr>
                <th>Nama Item</th>
                <th>Spesifikasi</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Perangkat Keras</td>
                <td>Monitor LED</td>
                <td>24 inci, Full HD</td>
            </tr>
            <tr>
                <td>Keyboard Mekanik</td>
                <td>
                    <ul>
                        <li>Switch: Cherry MX Red
                        <li>Lampu RGB</li>
                    <ul>
                </td>
            </tr>
            </tbody>
        </table>
</body>
</html>
